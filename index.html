<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEL 科技課情緒覺察</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google 官方身分驗證函式庫 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 min-h-screen text-slate-800 antialiased selection:bg-blue-100">
  <div id="root"></div>

  <!-- 接收 Form 背景提交的隱藏 iframe，確保不跳頁 -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const GOOGLE_CLIENT_ID = "1033396656612-ppuj2l9htfdjp4p7badsmv73udais4pm.apps.googleusercontent.com";

    const IconFrown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
    const IconHelp = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    const IconBattery = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="11"/></svg>;
    const IconCoffee = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>;
    const IconLightbulb = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
    const IconCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const IconRocket = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>;
    const IconChart = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;

    const EMOTIONS = [
      { id: 1, label: '卡關挫折', icon: IconFrown, color: 'bg-slate-500', textColor: 'text-slate-700', description: '程式一直報錯或找不到解法，心裡覺得有點煩躁、想放棄。' },
      { id: 2, label: '焦慮迷茫', icon: IconHelp, color: 'bg-orange-400', textColor: 'text-orange-700', description: '步驟太多不知道下一步該做什麼，擔心自己跟不上進度。' },
      { id: 3, label: '疲憊放空', icon: IconBattery, color: 'bg-blue-300', textColor: 'text-blue-700', description: '腦袋轉不太動、有點提不起勁，注意力一直飄走。' },
      { id: 4, label: '平靜專注', icon: IconCoffee, color: 'bg-emerald-300', textColor: 'text-emerald-800', description: '心情很放鬆穩定，按部就班照著節奏實作與學習。' },
      { id: 5, label: '好奇期待', icon: IconLightbulb, color: 'bg-yellow-400', textColor: 'text-yellow-800', description: '對接下來的任務很好奇，迫不及待想測試看看會發生什麼事！' },
      { id: 6, label: '得心應手', icon: IconCheck, color: 'bg-green-500', textColor: 'text-green-800', description: '目前內容都能理解與掌握，操作起來順暢又很有把握。' },
      { id: 7, label: '心流成就', icon: IconRocket, color: 'bg-amber-500', textColor: 'text-amber-800', description: '完全沉浸在創作中感覺時間過得飛快，解出難題超有成就感！' }
    ];

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    function StudentApp() {
      const [formId, setFormId] = useState('');
      const [emailId, setEmailId] = useState('');
      const [emoId, setEmoId] = useState('');
      const [classCode, setClassCode] = useState('');
      const [studentEmail, setStudentEmail] = useState('');
      const [studentName, setStudentName] = useState('');
      const [myEmotion, setMyEmotion] = useState(null);
      const [savedAlert, setSavedAlert] = useState(false);
      const [isFrozen, setIsFrozen] = useState(false); // 2 秒凍結狀態

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        setFormId(params.get('fid') || '');
        setEmailId(params.get('mid') || '');
        setEmoId(params.get('eid') || '');
        setClassCode(params.get('c') || '');

        const cachedEmail = localStorage.getItem('sel_verified_email');
        const cachedName = localStorage.getItem('sel_verified_name');
        if (cachedEmail) {
          setStudentEmail(cachedEmail);
          setStudentName(cachedName || '');
        }

        const initGoogleAuth = () => {
          if (window.google && window.google.accounts) {
            window.google.accounts.id.initialize({
              client_id: GOOGLE_CLIENT_ID,
              callback: (response) => {
                const data = parseJwt(response.credential);
                if (data && data.email) {
                  setStudentEmail(data.email);
                  setStudentName(data.name || '');
                  localStorage.setItem('sel_verified_email', data.email);
                  localStorage.setItem('sel_verified_name', data.name || '');
                }
              },
              auto_select: true
            });

            const btnContainer = document.getElementById("googleBtn");
            if (btnContainer) {
              window.google.accounts.id.renderButton(btnContainer, {
                theme: "filled_blue",
                size: "medium",
                shape: "pill",
                text: "signin_with"
              });
            }

            window.google.accounts.id.prompt();
          }
        };

        const timer = setInterval(() => {
          if (window.google && window.google.accounts) {
            initGoogleAuth();
            clearInterval(timer);
          }
        }, 300);

        return () => clearInterval(timer);
      }, []);

      const handleSelectEmotion = (emo) => {
        // 若在凍結期間，直接阻斷操作
        if (isFrozen) return;

        if (!studentEmail) {
          alert('請先在右上角點擊「使用 Google 帳戶登入」驗證身分！');
          return;
        }
        if (!formId || !emoId) {
          alert('網址缺少表單參數 (fid 或 eid)！');
          return;
        }

        // 啟動 2 秒凍結防暴擊
        setIsFrozen(true);
        setMyEmotion(emo.id);

        const btn = document.getElementById('emo-btn-' + emo.id);
        if (btn) {
          btn.classList.add('scale-110');
          setTimeout(() => btn.classList.remove('scale-110'), 300);
        }

        const targetUrl = `https://docs.google.com/forms/d/e/${formId}/formResponse`;

        const form = document.createElement('form');
        form.action = targetUrl;
        form.method = 'POST';
        form.target = 'hidden_iframe';

        // 1. 若有獨立信箱欄位 (mid)
        if (emailId) {
          const mInput = document.createElement('input');
          mInput.type = 'hidden';
          mInput.name = `entry.${emailId}`;
          mInput.value = studentEmail;
          form.appendChild(mInput);

          const eInput = document.createElement('input');
          eInput.type = 'hidden';
          eInput.name = `entry.${emoId}`;
          eInput.value = classCode ? `[${classCode}] ${emo.label}` : emo.label;
          form.appendChild(eInput);
        } else {
          // 2. 若為單一欄位，一併帶入班級、情緒與帳號
          const eInput = document.createElement('input');
          eInput.type = 'hidden';
          eInput.name = `entry.${emoId}`;
          eInput.value = `${classCode ? `[${classCode}] ` : ''}${emo.label} (${studentEmail})`;
          form.appendChild(eInput);
        }

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 2000);

        // 鎖定 2 秒（2000ms）後解除凍結
        setTimeout(() => {
          setIsFrozen(false);
        }, 2000);
      };

      return (
        <div className="min-h-screen font-sans pb-12">
          <header className="bg-white shadow-sm px-6 py-4 flex flex-wrap justify-between items-center gap-4 border-b border-gray-100">
            <div className="flex items-center space-x-3">
              <div className="bg-blue-600 p-2.5 rounded-xl shadow-sm text-white">
                <IconChart className="w-5 h-5" />
              </div>
              <div>
                <h1 className="text-xl font-bold text-gray-800 tracking-wide">SEL 科技課情緒覺察</h1>
                <p className="text-xs text-gray-400">專注當下學習感受，探索最佳解題步調</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {classCode && (
                <span className="text-sm bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-200 font-semibold">
                  班級：{classCode}
                </span>
              )}

              {studentEmail ? (
                <div className="text-xs md:text-sm bg-emerald-50 text-emerald-700 px-3.5 py-1.5 rounded-full border border-emerald-200 font-medium flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>{studentName ? `${studentName} (` : ''}<strong>{studentEmail}</strong>{studentName ? ')' : ''}</span>
                </div>
              ) : (
                <div id="googleBtn"></div>
              )}
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4 md:p-8 mt-4">
            <div className="bg-white rounded-3xl shadow-lg p-6 md:p-10 border border-gray-100 relative overflow-hidden">
              <div className="text-center mb-10">
                <h2 className="text-2xl md:text-3xl font-bold text-gray-800 mb-3">你現在的狀態是？</h2>
                <p className="text-gray-500">
                  {isFrozen ? (
                    <span className="text-blue-600 font-semibold flex items-center justify-center gap-2 animate-pulse">
                      <svg className="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                      </svg>
                      狀態同步中，請稍候 2 秒...
                    </span>
                  ) : studentEmail ? (
                    '點擊按鈕直接回報，資料將自動同步至課堂統計：'
                  ) : (
                    '👉 請先在右上角確認 Google 身分登入，再點擊狀態按鈕：'
                  )}
                </p>
              </div>

              <div className="flex flex-wrap justify-center gap-4 md:gap-6">
                {EMOTIONS.map((emo) => {
                  const Icon = emo.icon;
                  const isSelected = myEmotion === emo.id;
                  return (
                    <div key={emo.id} className="group relative flex flex-col items-center">
                      <div className="absolute bottom-full mb-3 w-60 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-30 flex flex-col items-center">
                        <div className="bg-gray-800 text-white text-xs md:text-sm rounded-xl p-3.5 shadow-2xl leading-relaxed text-center font-medium">
                          {emo.description}
                        </div>
                        <div className="w-3 h-3 bg-gray-800 transform rotate-45 -mt-1.5"></div>
                      </div>

                      <button
                        id={'emo-btn-' + emo.id}
                        disabled={isFrozen}
                        onClick={() => handleSelectEmotion(emo)}
                        className={`w-20 h-20 md:w-24 md:h-24 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 transform ${
                          isFrozen 
                            ? 'cursor-not-allowed opacity-60' 
                            : 'group-hover:-translate-y-2 group-hover:shadow-lg'
                        } ${
                          isSelected 
                            ? 'ring-4 ring-offset-4 ring-blue-500 scale-105 ' + emo.color
                            : 'bg-gray-50 border-2 border-gray-100 hover:border-transparent hover:' + emo.color
                        }`}
                      >
                        <Icon className={`w-8 h-8 md:w-10 md:h-10 mb-2 ${isSelected ? 'text-white' : emo.textColor}`} />
                        <span className={`text-xs md:text-sm font-bold ${isSelected ? 'text-white' : 'text-gray-700'}`}>
                          {emo.label}
                        </span>
                      </button>

                      {isSelected ? (
                        <div className="mt-3 text-blue-600 font-bold text-xs md:text-sm flex items-center animate-bounce">
                          <span className="mr-1">已回報</span>
                          <div className="w-2 h-2 bg-blue-600 rounded-full"></div>
                        </div>
                      ) : (
                        <div className="mt-3 h-5"></div>
                      )}
                    </div>
                  );
                })}
              </div>

              {savedAlert && (
                <div className="mt-6 mx-auto max-w-md bg-emerald-50 text-emerald-700 text-center py-2.5 px-4 rounded-xl text-sm font-semibold border border-emerald-200 flex items-center justify-center gap-2 shadow-sm animate-fade-in">
                  <span className="text-emerald-600 font-bold">✓</span> 狀態已更新至試算表！
                </div>
              )}

              <div className="mt-12 bg-blue-50 rounded-2xl p-6 text-center text-blue-900 text-sm md:text-base border border-blue-100 shadow-sm leading-relaxed">
                💡 <strong>SEL 溫馨叮嚀：</strong> 程式卡關、出錯是很自然的學習歷程！先深呼吸、或是向鄰近同學討論，轉換一下思緒，通常答案就會浮現出來囉！
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StudentApp />);
  </script>
</body>
</html>
